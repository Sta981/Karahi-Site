<section class="panel"><div class="section-head"><h2>New table order</h2><a class="text-link" href="{{ url_for('workspace.floor') }}">View floor plan →</a></div><form method="post" class="multi-form" data-lines>{{ csrf() }}<label>Available table<select name="table_id" required><option value="">Choose a table</option>{% for t in tables if table_states[t.id]=='available' %}<option value="{{ t.id }}" {{ 'selected' if request.args.get('table')|int==t.id }}>{{ t.label }} · {{ t.seats }} seats</option>{% endfor %}</select></label><div data-line-list><div class="entry-line" data-line><label>Dish<select name="item_id" required><option value="">Choose a dish</option>{% for i in items %}<option value="{{ i.id }}" data-price="{{ i.effective_price }}">{{ i.name }} · {{ currency_symbol }}{{ '%.2f'|format(i.effective_price) }}</option>{% endfor %}</select></label><label>Quantity<input type="number" name="qty" min="1" max="50" value="1" required></label><label>Kitchen note<input name="note" maxlength="54" placeholder="e.g. mild spice"></label><button type="button" class="secondary" data-remove>Remove</button></div></div><div class="board-tools"><button type="button" class="secondary" data-add>Add dish +</button><strong>Estimated total: {{ currency_symbol }}<span data-total>0.00</span></strong><button>Send to kitchen</button></div></form></section>
