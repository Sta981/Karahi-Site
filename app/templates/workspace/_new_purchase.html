<section class="panel"><h2>New purchase order</h2><form method="post" class="multi-form" data-lines>{{ csrf() }}<label>Supplier<select name="supplier_id" required>{% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}</select></label><div data-line-list><div class="entry-line" data-line><label>Ingredient<select name="ingredient_id" required>{% for i in ingredients %}<option value="{{ i.id }}">{{ i.name }} ({{ i.unit }})</option>{% endfor %}</select></label><label>Quantity<input name="quantity" type="number" step="0.001" min="0.001" required></label><label>Unit cost<input name="cost" type="number" min="0" step="0.01" required></label><button type="button" class="secondary" data-remove>Remove</button></div></div><div class="board-tools"><button type="button" class="secondary" data-add>Add ingredient +</button><strong>Estimated total: {{ currency_symbol }}<span data-total>0.00</span></strong><button>Create draft</button></div></form></section>
