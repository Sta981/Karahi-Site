{% extends "base.html" %}
{% from "partials/_macros.html" import csrf %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="narrow">
  <h1>Log in</h1>
  {% if error %}<p class="flash error">{{ error }}</p>{% endif %}
  <form method="post" class="stack">
    {{ csrf() }}
    <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" value="{{ email }}" required autocomplete="email"></div>
    <div class="field"><label for="password">Password</label><input id="password" name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn">Log in</button>
  </form>
  <p>New here? <a href="{{ url_for('auth.register') }}">Create an account</a>.</p>
</section>
{% endblock %}
