# Classroom demonstration; SQLite is ephemeral on free Render services.
services:
  - type: web
    name: karahi-house
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 2 --bind 0.0.0.0:$PORT run:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: RESTRO_DEMO
        value: "1"
      - key: COOKIE_SECURE
        value: "1"
      - key: DATABASE_URL
        value: sqlite:///restroiq_render_v5.db
      - key: DEMO_OWNER_PASSWORD
        sync: false
      - key: DEMO_STAFF_PASSWORD
        sync: false
      - key: DEMO_CUSTOMER_PASSWORD
        sync: false
